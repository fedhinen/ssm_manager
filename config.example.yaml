targets:
  - name: orders-postgres
    profile: development
    region: us-east-1
    host: orders.cluster.example.us-east-1.rds.amazonaws.com
    remote_port: 5432

  - name: redis-main
    profile: development
    region: us-east-1
    host: redis.example.cache.amazonaws.com
    remote_port: 6379

# Bookmarks are normally created after a dynamic session ends. They can also be
# declared manually.
bookmarks:
  - name: api-shell
    type: shell
    profile: development
    region: us-east-1
    instance_id: i-0123456789abcdef0
    instance_name: api-dev

  - name: orders-local
    type: remote-host
    profile: development
    region: us-east-1
    instance_id: i-0123456789abcdef0
    instance_name: bastion-dev
    host: orders.cluster.example.us-east-1.rds.amazonaws.com
    remote_port: 5432
    local_port: 15432

  # A bookmark can start several tunnels through the same EC2 instance.
  - name: stack-dev
    profile: development
    region: us-east-1
    instance_id: i-0123456789abcdef0
    instance_name: bastion-dev
    tunnels:
      - name: database
        type: remote-host
        host: orders.cluster.example.us-east-1.rds.amazonaws.com
        remote_port: 5432
        local_port: 15432
      - name: redis
        type: remote-host
        host: redis.example.cache.amazonaws.com
        remote_port: 6379
        local_port: 16379
